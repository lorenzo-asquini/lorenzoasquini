name: Deploy Next.js site to Pages

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ['main']

    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    id-token: write
    pages: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
    cancel-in-progress: false
    group: 'pages'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  cache: npm
                  node-version-file: '.nvmrc'

            - name: Setup Pages
              uses: actions/configure-pages@v6

            # Keyed on sources as well as the lockfile so an unchanged build reuses the cache
            - name: Restore Next.js cache
              uses: actions/cache@v6
              with:
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'data/**', 'next.config.mjs', 'postcss.config.mjs', 'public/**', 'tsconfig.json') }}
                  path: .next/cache
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Check formatting, lint, and build
              run: npm run ci

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
